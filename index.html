<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e79">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="そなえ帳">
<title>そなえ帳 試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: phone-first app shell. Fixed bottom tab bar, one scrolling view, sheet for editing. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#1b2430; --muted:#5d6b7a; --line:#dfe4ea;
  --accent:#1f4e79; --accent-soft:#e3ecf5;
  --sos:#c8321e; --sos-soft:#fbe7e3;
  --ok:#2e7d4f; --ok-soft:#e2f2e8; --warn:#b26a00; --warn-soft:#fdf0d9; --bad:#c8321e; --bad-soft:#fbe7e3;
  --font-head:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --font-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --tabh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#1a2129; --ink:#e7ecf1; --muted:#9aa8b6; --line:#2b3540;
  --accent:#7fb2e0; --accent-soft:#1d2c3b; --sos:#ff6b55; --sos-soft:#3a1f1b;
  --ok:#6cc896; --ok-soft:#183026; --warn:#f0b04a; --warn-soft:#352914; --bad:#ff6b55; --bad-soft:#3a1f1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#1a2129; --ink:#e7ecf1; --muted:#9aa8b6; --line:#2b3540;
  --accent:#7fb2e0; --accent-soft:#1d2c3b; --sos:#ff6b55; --sos-soft:#3a1f1b;
  --ok:#6cc896; --ok-soft:#183026; --warn:#f0b04a; --warn-soft:#352914; --bad:#ff6b55; --bad-soft:#3a1f1b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(var(--tabh) + 28px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--font-head);text-wrap:balance;margin:0}
h1{font-size:22px;font-weight:900;letter-spacing:.02em}
h2{font-size:17px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.brand{display:flex;flex-direction:column}
.brand small{color:var(--muted);font-size:12px}
.offline{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ok);background:var(--ok-soft);padding:4px 10px;border-radius:999px;white-space:nowrap}
.offline::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.note{font-size:12px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin-bottom:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.card-head span{font-size:12px;color:var(--muted)}
/* score */
.score{display:grid;gap:12px}
.meter{display:grid;grid-template-columns:88px 1fr 70px;align-items:center;gap:10px}
.meter .lbl{font-weight:500;font-size:14px}
.bar{position:relative;height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:6px}
.bar::after{content:"";position:absolute;top:-2px;bottom:-2px;left:50%;width:2px;background:var(--muted);opacity:.6}
.meter .d{text-align:right;font-family:var(--font-head);font-weight:900;font-size:18px}
.meter .d small{font-size:11px;font-weight:500;color:var(--muted);margin-left:2px}
.scale{display:grid;grid-template-columns:88px 1fr 70px;gap:10px;font-size:11px;color:var(--muted)}
.scale div{position:relative;height:14px}
.scale b{position:absolute;font-weight:400;transform:translateX(-50%);white-space:nowrap}
.headline{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.big{white-space:nowrap;font-family:var(--font-head);font-weight:900;font-size:44px;line-height:1;color:var(--accent)}
.big small{font-size:16px;margin-left:2px}
.headline p{font-size:13px;color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-mute{background:var(--accent-soft);color:var(--accent)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .main b{display:block;font-weight:500;overflow-wrap:anywhere}
.row .main small{color:var(--muted);font-size:12px}
.btn{font:inherit;font-size:13px;font-weight:700;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px;cursor:pointer;white-space:nowrap}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.check{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;font-size:13px}
.check span{display:flex;gap:6px;align-items:center}
.check .y::before{content:"✓";color:var(--ok);font-weight:700}
.check .n{color:var(--muted)} .check .n::before{content:"—";color:var(--bad);font-weight:700}
.sect-title{display:flex;justify-content:space-between;align-items:center;margin:4px 0 -4px}
.sect-title h2{font-size:15px;color:var(--muted)}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh)}
.tab{font:inherit;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}
.tab.sos{color:var(--sos)}
.tab.sos .dot{background:var(--sos);color:#fff;border-radius:12px;width:44px;height:30px;display:grid;place-items:center}
.tab.sos .dot svg{width:20px;height:20px}
.tab.sos[aria-current="page"]{font-weight:700}
/* sos */
.sos-wrap{background:#0d0f12;color:#f2f2f2;border-radius:16px;padding:16px}
.sos-wrap h2{color:#fff;font-size:20px}
.sos-wrap p{color:#c9ced4}
.sos-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.sosbtn{font:inherit;font-family:var(--font-head);font-weight:900;font-size:19px;padding:18px 10px;border-radius:14px;border:2px solid #3a3f47;background:#1a1d22;color:#fff;cursor:pointer;text-align:left}
.sosbtn small{display:block;font-family:var(--font-body);font-weight:400;font-size:12px;color:#aab1ba;margin-top:2px}
.sosbtn:last-child{grid-column:1/-1}
.sosbtn[aria-pressed="true"]{border-color:#ff6b55;background:#3a1f1b}
.steps{counter-reset:s;list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:10px;font-size:16px;line-height:1.5}
.steps li::before{content:counter(s);font-family:var(--font-head);font-weight:900;background:#ff6b55;color:#0d0f12;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-size:15px}
.sos-links{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.sos-links a{color:#fff;background:#1a1d22;border:1px solid #3a3f47;border-radius:10px;padding:10px 12px;text-decoration:none;display:flex;justify-content:space-between;gap:8px}
.sos-links a span{color:#aab1ba;font-size:12px}
.sos-sub{margin-top:16px;font-family:var(--font-head);font-weight:700;color:#fff;font-size:15px}
.where{display:flex;flex-direction:column;gap:6px;margin-top:8px;font-size:14px}
.where div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #2a2e35;padding-bottom:6px}
.where b{color:#fff}
.contact{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #2a2e35}
.contact .tel{font-family:var(--font-head);font-size:18px;font-weight:700;color:#fff;user-select:all}
/* sheet */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(10,14,20,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.form{display:grid;gap:12px;margin-top:12px}
.form label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
textarea{font-size:12px;font-family:ui-monospace,Menlo,monospace;height:120px}
.actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;z-index:50}
.stepper{display:flex;align-items:center;gap:8px}
.stepper output{min-width:24px;text-align:center;font-weight:700}
.hh{display:grid;gap:8px}
.hh div{display:flex;justify-content:space-between;align-items:center}
.tmpl{display:grid;gap:4px}
.tmpl label{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink);padding:6px 0;border-top:1px solid var(--line)}
.tmpl input{width:auto}
details{border-top:1px solid var(--line);padding:10px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:700;font-family:var(--font-head)}
details ul,details ol{margin:8px 0 0;padding-left:20px;display:grid;gap:4px;font-size:14px}
a{color:var(--accent)}
/* scanner */
.scan-overlay{z-index:60}
.scan-box{position:relative;margin-top:12px;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%}
.scan-box video{width:100%;height:100%;object-fit:cover;display:block}
.scan-box i{position:absolute;left:10%;right:10%;top:35%;bottom:35%;border:3px solid #ff6b55;border-radius:8px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
/* print (A4) */
#print{display:none}
@page{size:A4;margin:12mm}
@media print{
  body{background:#fff;color:#000}
  .wrap,.tabs,#layer,#scanner,.toast{display:none!important}
  #print{display:block;font-family:var(--font-body);font-size:10.5pt;line-height:1.45;color:#000}
  #print h1{font-family:var(--font-head);font-size:20pt;font-weight:900}
  #print h3{font-family:var(--font-head);font-size:11.5pt;margin:0 0 4px}
  #print table{width:100%;border-collapse:collapse}
  #print td,#print th{border-bottom:.5pt solid #999;padding:3px 4px;text-align:left;vertical-align:top}
  #print th{font-size:9pt;border-bottom:1pt solid #000}
  #print ol{margin:0;padding-left:16px}
  .pr-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2pt solid #000;padding-bottom:4px;margin-bottom:8px}
  .pr-head p{font-size:9pt}
  .pr-grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  .pr-box{border:1pt solid #000;border-radius:4px;padding:6px 8px;break-inside:avoid;margin-bottom:8px}
  .pr-grid2 .pr-box{margin-bottom:0}
  .pr-list td:nth-child(3),.pr-list td:nth-child(5){text-align:center;width:3em}
  .pr-list td:nth-child(4){width:7em}
  .pr-foot{font-size:9pt;margin-top:6px}
  .pr-steps{font-size:9pt;gap:6px}
  .pr-step h3{font-size:10pt}
  .pr-grid2 td:first-child{width:7.5em}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>

<body>
<div class="wrap" id="app"></div>
<div class="tabs"><nav id="tabs" aria-label="メニュー"></nav></div>
<div id="layer"></div>
<div id="print" aria-hidden="true"></div>

<script>
(function(){
const DAY=86400000;
const today=new Date(); today.setHours(0,0,0,0);
const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const plus=n=>iso(today.getTime()+n*DAY);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const CATS={
  water:{name:"水",unit:"L",calc:true},
  food:{name:"食料",unit:"食",calc:true},
  toilet:{name:"トイレ",unit:"回",calc:true},
  light:{name:"明かり・電源",unit:"個"},
  hygiene:{name:"衛生用品",unit:"個"},
  medical:{name:"医薬品",unit:"個"},
  other:{name:"その他",unit:"個"}
};
const PLACES=["キッチン","玄関","押入れ","寝室","車","その他"];
const ESSENTIALS=[
  ["flashlight","懐中電灯"],["battery","乾電池"],["mobilebat","モバイルバッテリー"],["radio","ラジオ"],
  ["stove","カセットコンロ"],["gas","カセットボンベ"],["cash","現金・小銭"],["meds","常備薬"],
  ["firstaid","救急セット"],["wipes","ウェットティッシュ"],["bags","ポリ袋"],["gloves","軍手"]
];
const TEMPLATES=[
  {name:"保存水 2L",cat:"water",per:2,qty:6,ess:"",days:1825},
  {name:"アルファ米",cat:"food",per:1,qty:6,ess:"",days:1825},
  {name:"レトルト食品",cat:"food",per:1,qty:6,ess:"",days:365},
  {name:"缶詰",cat:"food",per:1,qty:6,ess:"",days:1095},
  {name:"簡易トイレ（30回分）",cat:"toilet",per:30,qty:1,ess:"",days:3650},
  {name:"懐中電灯",cat:"light",per:1,qty:1,ess:"flashlight"},
  {name:"乾電池 単3",cat:"light",per:1,qty:8,ess:"battery",days:1825},
  {name:"モバイルバッテリー",cat:"light",per:1,qty:1,ess:"mobilebat"},
  {name:"手回しラジオ",cat:"light",per:1,qty:1,ess:"radio"},
  {name:"カセットコンロ",cat:"other",per:1,qty:1,ess:"stove"},
  {name:"カセットボンベ",cat:"other",per:1,qty:3,ess:"gas",days:2555},
  {name:"現金・小銭",cat:"other",per:1,qty:1,ess:"cash"},
  {name:"常備薬",cat:"medical",per:1,qty:1,ess:"meds",days:365},
  {name:"救急セット",cat:"medical",per:1,qty:1,ess:"firstaid"},
  {name:"ウェットティッシュ",cat:"hygiene",per:1,qty:3,ess:"wipes",days:1095},
  {name:"ポリ袋（45L）",cat:"hygiene",per:1,qty:20,ess:"bags"},
  {name:"軍手",cat:"other",per:1,qty:2,ess:"gloves"}
];
function sample(){
  let id=1;const I=(name,cat,per,qty,exp,place,ess)=>({id:id++,name,cat,per,qty,exp,place,ess:ess||""});
  return {
    hh:{adult:2,child:0,infant:0,elder:0,pet:1},
    goal:7,
    items:[
      I("保存水 2L","water",2,6,plus(240),"キッチン"),
      I("保存水 500ml","water",0.5,12,plus(24),"玄関"),
      I("アルファ米","food",1,9,plus(720),"押入れ"),
      I("レトルトカレー","food",1,6,plus(18),"キッチン"),
      I("さば缶","food",1,8,plus(400),"キッチン"),
      I("カップ麺","food",1,5,plus(40),"キッチン"),
      I("簡易トイレ（30回分）","toilet",30,1,"","押入れ"),
      I("懐中電灯","light",1,2,"","玄関","flashlight"),
      I("モバイルバッテリー","light",1,1,"","寝室","mobilebat"),
      I("乾電池 単3","light",1,8,plus(1100),"押入れ","battery"),
      I("カセットボンベ","other",1,3,plus(1800),"押入れ","gas"),
      I("常備薬（解熱剤）","medical",1,1,plus(-10),"寝室","meds"),
      I("ウェットティッシュ","hygiene",1,3,plus(500),"押入れ","wipes"),
      I("現金・小銭","other",1,1,"","寝室","cash")
    ],
    contacts:[
      {name:"例：家族A（携帯）",tel:"090-0000-0000"},
      {name:"例：かかりつけ医",tel:"055-000-0000"}
    ],
    meet:"例：〇〇小学校の校庭（第1避難所）",
    meet2:"例：□□公民館（自宅が危険な時）",
    seq:id
  };
}
const KEY="sonae-proto-v1";
let S;
try{S=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){S=null}
if(!S||!S.items)S=sample();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

// ---- calculations
const persons=()=>S.hh.adult+S.hh.child+S.hh.infant+S.hh.elder;
function need(cat){
  const p=persons();
  if(cat==="water")return p*3+S.hh.pet*0.5;
  if(cat==="food")return p*3;
  if(cat==="toilet")return p*5;
  return 0;
}
const daysLeft=it=>it.exp?Math.round((new Date(it.exp+"T00:00:00")-today)/DAY):null;
const usable=it=>{const d=daysLeft(it);return d===null||d>=0};
function supply(cat){return S.items.filter(i=>i.cat===cat&&usable(i)).reduce((a,i)=>a+i.qty*i.per,0)}
function days(cat){const n=need(cat);return n?supply(cat)/n:0}
function expState(it){
  const d=daysLeft(it); if(d===null)return null;
  if(d<0)return {cls:"p-bad",t:"期限切れ"};
  if(d<=30)return {cls:"p-warn",t:"あと"+d+"日"};
  if(d<=90)return {cls:"p-mute",t:"あと"+d+"日"};
  return {cls:"p-ok",t:it.exp.replace(/-/g,"/")};
}
function shortages(){
  const out=[];const g=S.goal;
  const w=g*need("water")-supply("water"); if(w>0)out.push({name:"保存水 2L",q:Math.ceil(w/2)+"本",why:"水があと"+w.toFixed(1)+"L足りません",kw:"保存水 2L"});
  const f=g*need("food")-supply("food"); if(f>0)out.push({name:"非常食（アルファ米・レトルトなど）",q:Math.ceil(f)+"食",why:"食料があと"+Math.ceil(f)+"食分足りません",kw:"非常食 長期保存"});
  const t=g*need("toilet")-supply("toilet"); if(t>0)out.push({name:"簡易トイレ",q:Math.ceil(t)+"回分",why:"トイレがあと"+Math.ceil(t)+"回分足りません",kw:"簡易トイレ 非常用"});
  return out;
}
const hasEss=k=>S.items.some(i=>i.ess===k&&usable(i)&&i.qty>0);

// ---- icons
const ic={

function renderTabs(){
  document.getElementById("tabs").innerHTML=TABS.map(([k,l])=>k==="sos"
    ?`<button class="tab sos" data-tab="${k}" ${view===k?'aria-current="page"':""}><span class="dot">${ic.sos}</span>${l}</button>`
    :`<button class="tab" data-tab="${k}" ${view===k?'aria-current="page"':""}>${ic[k==="stock"?"box":k==="shop"?"cart":k]}${l}</button>`).join("");
}
function header(title,sub){
  return `<div class="top"><div class="brand"><h1>${title}</h1>${sub?`<small>${sub}</small>`:""}</div><span class="offline">オフラインで動作</span></div>`;
}

// ---- views

  }).join("");

  `<p class="note">試作版です。表示はサンプルデータで、変更はこの端末にだけ保存されます。ホーム画面に追加すると、通信なしでも開けます。</p>

    <div class="score">${meters}
      <div class="scale"><span></span><div><b style="left:0">0</b><b style="left:21.4%">3日</b><b style="left:50%">7日</b><b style="left:100%;transform:translateX(-100%)">14日</b></div><span></span></div>
    </div>
  </section>
  <section class="card">
    <div class="card-head"><h2>あと何を買えば${g}日分？</h2><button class="btn ghost sm" data-go="shop">買い物リストへ</button></div>
    ${short.length?`<div class="list">${short.map(s=>`<div class="row"><div class="main"><b>${esc(s.name)}</b><small>${esc(s.why)}</small></div><span class="pill p-warn num">${esc(s.q)}</span></div>`).join("")}</div>`:`<p>水・食料・トイレは${g}日分そろっています。</p>`}
  </section>
  <section class="card">
    <div class="card-head"><h2>期限が近いもの</h2><span>60日以内</span></div>

      <p style="font-size:12px;color:var(--muted);margin-top:8px">食べたら「使った」を押すと、買い物リストに補充分が入ります。</p>`:`<p>期限が近いものはありません。</p>`}
  </section>
  <section class="card">
    <div class="card-head"><h2>必需品チェック</h2><span class="num">${essHave} / ${ESSENTIALS.length}</span></div>
    <div class="check">${ESSENTIALS.map(([k,l])=>`<span class="${hasEss(k)?"y":"n"}">${l}</span>`).join("")}</div>

function itemRow(i){
  const e=expState(i);const c=CATS[i.cat];
  const amt=c.calc?`${i.qty}個（${+(i.qty*i.per).toFixed(1)}${c.unit}分）`:`${i.qty}${c.unit}`;
  return `<div class="row"><div class="main"><b>${esc(i.name)}</b><small class="num">${amt} ・ ${esc(stockMode==="cat"?i.place:c.name)}</small></div>${e?`<span class="pill ${e.cls}">${e.t}</span>`:""}<button class="btn sm" data-use="${i.id}" ${i.qty<1?"disabled":""}>使った</button><button class="btn sm ghost" data-edit="${i.id}" aria-label="${esc(i.name)}を編集">編集</button></div>`;
}
function vStock(){
  const groups=stockMode==="cat"?Object.keys(CATS).map(k=>[CATS[k].name,S.items.filter(i=>i.cat===k)])

  <div class="actions" style="margin:0"><div class="chips" role="group" aria-label="並べ方">

// アフィリエイトID（Amazonアソシエイトのトラッキング ID と 楽天アフィリエイトID）
const AFF={amazon:"",rakuten:""};
function amazonUrl(kw){return "https://www.amazon.co.jp/s?k="+encodeURIComponent(kw)+(AFF.amazon?"&tag="+encodeURIComponent(AFF.amazon):"")}
function rakutenUrl(kw){
  const u="https://search.rakuten.co.jp/search/mall/"+encodeURIComponent(kw)+"/";
  return AFF.rakuten?"https://hb.afl.rakuten.co.jp/hgc/"+AFF.rakuten+"/?pc="+encodeURIComponent(u)+"&m="+encodeURIComponent(u):u;
}
function shopLinks(kw){
  return `<a class="btn sm" href="${esc(amazonUrl(kw))}" target="_blank" rel="noopener sponsored">Amazon</a><a class="btn sm" href="${esc(rakutenUrl(kw))}" target="_blank" rel="noopener sponsored">楽天</a>`;
}

  const short=shortages();
  const used=S.items.filter(i=>i.used>0);
  const exp=S.items.filter(i=>{const d=daysLeft(i);return d!==null&&d<=30});
  const sec=(t,sub,rows)=>`<section class="card"><div class="card-head"><h2>${t}</h2><span>${sub}</span></div>${rows||'<p style="color:var(--muted)">ありません</p>'}</section>`;
  return header("買い物リスト","不足分と補充分を自動でまとめています")+
  `<p class="note">【PR】Amazon・楽天のリンクは広告（アフィリエイト）を含みます。お店で買う時はこの画面を見せるだけでOKです。</p>
  <div class="stack">
  ${sec(`${S.goal}日分に足りないもの`,"家族の人数から計算",short.length?`<div class="list">${short.map(s=>`<div class="row"><div class="main"><b>${esc(s.name)}</b><small>${esc(s.why)}</small></div><span class="pill p-warn num">${esc(s.q)}</span></div><div class="actions" style="justify-content:flex-end;margin:0 0 6px">${shopLinks(s.kw)}</div>`).join("")}</div>`:"")}
  ${sec("使った分の補充","「使った」を押したもの",used.length?`<div class="list">${used.map(i=>`<div class="row"><div class="main"><b>${esc(i.name)}</b><small class="num">${i.used}個 使用</small></div>${shopLinks(i.name)}<button class="btn sm" data-bought="${i.id}">買った</button></div>`).join("")}</div>`:"")}
  ${sec("期限切れ・30日以内","入れ替えの目安",exp.length?`<div class="list">${exp.map(i=>{const e=expState(i);return `<div class="row"><div class="main"><b>${esc(i.name)}</b><small>${esc(i.place)}</small></div><span class="pill ${e.cls}">${e.t}</span>${shopLinks(i.name)}</div>`}).join("")}</div>`:"")}
  </div>`;

// ---- sheets
function openSheet(html){document.getElementById("layer").innerHTML=`<div class="overlay" data-close="1"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;const f=document.querySelector(".sheet input,.sheet button");if(f)f.focus()}
function closeSheet(){document.getElementById("layer").innerHTML=""}
function applyCode(code){
  const f=document.getElementById("f-code");if(!f)return;
  f.value=code;document.getElementById("f-code-show").textContent="バーコード "+code;
  const m=(S.codes||{})[code];
  if(m){
    document.getElementById("f-name").value=m.name;document.getElementById("f-cat").value=m.cat;
    document.getElementById("f-per").value=m.per;document.getElementById("f-place").value=m.place;
    toast("登録済みの品名を入れました");document.getElementById("f-exp").focus();
  }else{toast("はじめての商品です。品名を入れてください（次回から自動で入ります）");document.getElementById("f-name").focus()}
}

    <div class="two"><label>個数<input id="f-qty" type="number" min="0" inputmode="numeric" value="${it.qty}"></label>
    <label id="f-per-l">1個あたり（L・食・回）<input id="f-per" type="number" min="0" step="0.1" inputmode="decimal" value="${it.per}"></label></div>
    <label>賞味・使用期限（なければ空欄）<input id="f-exp" type="date" value="${esc(it.exp)}"></label>
    ${!n&&it.exp?`<div class="actions" style="margin:0;justify-content:flex-start"><button type="button" class="btn sm" data-calone="${it.id}">この期限をカレンダーに登録</button><a class="btn sm" href="${esc(gcalUrl(it))}" target="_blank" rel="noopener">Googleカレンダー</a></div>`:""}
    <div class="actions">${n?"<span></span>":`<button type="button" class="btn" data-del="${it.id}" style="color:var(--bad)">削除</button>`}<span style="display:flex;gap:8px"><button type="button" class="btn" data-close="1">やめる</button><button class="btn primary" type="submit">保存</button></span></div>
  </form>`);
  document.getElementById("f-item").addEventListener("submit",e=>{
    e.preventDefault();
    const v={name:document.getElementById("f-name").value.trim(),cat:document.getElementById("f-cat").value,place:document.getElementById("f-place").value,
      qty:Math.max(0,+document.getElementById("f-qty").value||0),per:Math.max(0,+document.getElementById("f-per").value||1),exp:document.getElementById("f-exp").value,
      code:document.getElementById("f-code").value};
    if(!v.name)return;
    if(v.code){S.codes=S.codes||{};S.codes[v.code]={name:v.name,cat:v.cat,per:v.per,place:v.place}}
    if(n){S.items.push({id:S.seq++,ess:"",...v})}else{Object.assign(S.items.find(x=>x.id===it.id),v)}
    save();closeSheet();render();toast("保存しました");
  });
  if(autoScan)openScanner(applyCode);
}

// ---- barcode scanner（対応端末は標準機能、iPhoneなどはZXingで読み取る）
let scanStop=null;
function loadZXing(){
  return new Promise((ok,ng)=>{if(window.ZXing)return ok();const s=document.createElement("script");s.src="zxing.min.js";s.onload=()=>ok();s.onerror=ng;document.head.appendChild(s)});
}
function closeScanner(){if(scanStop){try{scanStop()}catch(e){}scanStop=null}const el=document.getElementById("scanner");if(el)el.remove()}
async function openScanner(onCode){
  closeScanner();
  const el=document.createElement("div");el.id="scanner";el.className="overlay scan-overlay";
  el.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="バーコード読み取り"><h2>バーコードを読み取る</h2>
    <p style="font-size:13px;color:var(--muted);margin-top:4px">商品のバーコード（JANコード）を枠に合わせてください。</p>
    <div class="scan-box"><video id="scan-video" playsinline muted></video><i></i></div>
    <p id="scan-msg" style="font-size:13px;color:var(--muted)">カメラを起動しています…</p>
    <form id="scan-manual" class="form" style="margin-top:4px"><label>読み取れない時は数字を入力<input id="scan-code" inputmode="numeric" pattern="[0-9]{8,14}" placeholder="例：4901234567894"></label>
    <div class="actions"><button type="button" class="btn" data-scanclose="1">やめる</button><button class="btn primary" type="submit">この番号を使う</button></div></form></div>`;
  document.body.appendChild(el);
  let done=false;
  const finish=code=>{if(done)return;done=true;if(navigator.vibrate)navigator.vibrate(80);closeScanner();onCode(code)};
  document.getElementById("scan-manual").addEventListener("submit",e=>{e.preventDefault();const v=document.getElementById("scan-code").value.replace(/\D/g,"");if(v.length>=8)finish(v)});
  const video=document.getElementById("scan-video"),msg=document.getElementById("scan-msg");
  try{
    if("BarcodeDetector" in window&&(await BarcodeDetector.getSupportedFormats()).includes("ean_13")){
      const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});
      video.srcObject=stream;await video.play();
      const det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a"]});let alive=true;
      scanStop=()=>{alive=false;stream.getTracks().forEach(t=>t.stop())};
      msg.textContent="読み取り中…";
      const loop=async()=>{if(!alive)return;try{const r=await det.detect(video);if(r.length)return finish(r[0].rawValue)}catch(e){}requestAnimationFrame(loop)};loop();
    }else{
      await loadZXing();
      const hints=new Map();hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A]);
      const reader=new ZXing.BrowserMultiFormatReader(hints,300);
      scanStop=()=>reader.reset();
      msg.textContent="読み取り中…";
      await reader.decodeFromConstraints({video:{facingMode:"environment"},audio:false},video,(res)=>{if(res)finish(res.getText())});
    }
  }catch(e){
    msg.textContent="カメラを使えませんでした。設定でカメラを許可するか、下に数字を入力してください。";
  }
}

// ---- calendar（.ics を作って端末のカレンダーに取り込む）
function ymd(s){return s.replace(/-/g,"")}
function addDays(s,n){return iso(new Date(s+"T00:00:00").getTime()+n*DAY)}
function icsText(items,before){
  const now=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const ev=items.map(i=>[
    "BEGIN:VEVENT","UID:sonae-"+i.id+"-"+ymd(i.exp)+"@sonae-app","DTSTAMP:"+now,
    "DTSTART;VALUE=DATE:"+ymd(i.exp),"DTEND;VALUE=DATE:"+ymd(addDays(i.exp,1)),
    "SUMMARY:【そなえ帳】"+i.name.replace(/[,;]/g," ")+"の期限",
    "DESCRIPTION:保管場所 "+i.place+"。期限前に食べて（使って）買い足しましょう。",
    "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+i.name.replace(/[,;]/g," ")+"の期限が近づいています","TRIGGER:-P"+before+"D","END:VALARM",
    "END:VEVENT"].join("\r\n"));
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//sonae-app//JA","CALSCALE:GREGORIAN",...ev,"END:VCALENDAR"].join("\r\n");
}
function downloadIcs(items,before){
  if(!items.length)return toast("期限の入った品目がありません");
  const blob=new Blob([icsText(items,before)],{type:"text/calendar;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="sonae-kigen.ics";
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
  toast("カレンダーファイルを作りました。開いて「すべて追加」を押してください");
}
function gcalUrl(i){
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("【そなえ帳】"+i.name+"の期限")+"&dates="+ymd(i.exp)+"/"+ymd(addDays(i.exp,1))+"&details="+encodeURIComponent("保管場所 "+i.place);
}
function calSheet(){
  const list=S.items.filter(i=>i.exp&&daysLeft(i)>=0).sort((a,b)=>a.exp.localeCompare(b.exp));
  openSheet(`<h2>期限をカレンダーに登録</h2><p style="font-size:13px;color:var(--muted);margin-top:4px">選んだ品目の期限日を、スマホのカレンダーに予定として入れます。お知らせも付きます。</p>
  <form id="f-cal" class="form">
    <label>お知らせのタイミング<select id="cal-before"><option value="30">期限の1か月前</option><option value="14">期限の2週間前</option><option value="7">期限の1週間前</option></select></label>
    <div class="tmpl">${list.map(i=>`<label><input type="checkbox" value="${i.id}" checked>${esc(i.name)}<span style="margin-left:auto;color:var(--muted);font-size:12px" class="num">${i.exp.replace(/-/g,"/")}</span></label>`).join("")||"<p>期限の入った品目がありません</p>"}</div>
    <p style="font-size:12px;color:var(--muted)">iPhoneはファイルを開いて「すべて追加」、Androidはカレンダーアプリで開いてください。Googleカレンダーには各品目の「編集」から1件ずつ登録できます。</p>
    <div class="actions"><span></span><span style="display:flex;gap:8px"><button type="button" class="btn" data-close="1">やめる</button><button class="btn primary" type="submit">カレンダーに登録</button></span></div>
  </form>`);
  document.getElementById("f-cal").addEventListener("submit",e=>{
    e.preventDefault();
    const ids=[...document.querySelectorAll("#f-cal input:checked")].map(x=>+x.value);
    downloadIcs(S.items.filter(i=>ids.includes(i.id)),+document.getElementById("cal-before").value);
  });
}

// ---- 印刷用A4
function buildPrint(){
  const byPlace={};S.items.filter(i=>i.qty>0).forEach(i=>(byPlace[i.place]=byPlace[i.place]||[]).push(i));
  const cats=["water","food","toilet"];
  const firstSteps=["quake","power","net","water"].map(k=>`<div class="pr-box pr-step"><h3>${SOS[k].l}</h3><ol>${SOS[k].steps.slice(0,3).map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div>`).join("");
  document.getElementById("print").innerHTML=`
  <header class="pr-head"><h1>わが家の防災シート</h1><p>作成日 ${iso(today).replace(/-/g,"/")} ・ ${persons()}人${S.hh.pet?"＋ペット"+S.hh.pet:""} ・ そなえ帳</p></header>
  <section class="pr-grid2">
    <div class="pr-box"><h3>家族の連絡先</h3><table>${S.contacts.map(c=>`<tr><td>${esc(c.name)}</td><td class="num">${esc(c.tel)}</td></tr>`).join("")}<tr><td>集合場所</td><td>${esc(S.meet)}</td></tr><tr><td>第2の集合場所</td><td>${esc(S.meet2)}</td></tr></table></div>
    <div class="pr-box"><h3>備えの日数（${iso(today).replace(/-/g,"/")}時点）</h3><table>${cats.map(c=>`<tr><td>${CATS[c].name}</td><td class="num">${days(c).toFixed(1)}日分</td></tr>`).join("")}</table>
      <h3 style="margin-top:8px">災害用伝言ダイヤル 171</h3><p>171 → 録音「1」・再生「2」 → 自宅の番号（市外局番から）</p></div>
  </section>
  <section class="pr-box"><h3>備蓄リスト（保管場所ごと）</h3>
    <table class="pr-list"><thead><tr><th>保管場所</th><th>品名</th><th>数</th><th>期限</th><th>点検</th></tr></thead><tbody>
    ${PLACES.filter(p=>byPlace[p]).map(p=>byPlace[p].map((i,ix)=>`<tr><td>${ix?"":esc(p)}</td><td>${esc(i.name)}</td><td class="num">${i.qty}</td><td class="num">${i.exp?i.exp.replace(/-/g,"/"):"—"}</td><td>□</td></tr>`).join("")).join("")}
    </tbody></table></section>
  <section class="pr-grid2 pr-steps"><h3 style="grid-column:1/-1;margin:0">最初にやること</h3>${firstSteps}</section>
  <p class="pr-foot">停電・通信障害でスマホが使えない時のために、冷蔵庫や玄関など目につく場所に貼っておきましょう。</p>`;
}
function printSheet(){
  openSheet(`<h2>印刷用A4</h2><p style="margin-top:6px">連絡先・集合場所・備えの日数・保管場所ごとの備蓄リスト・最初にやることを、A4にまとめて印刷します。</p>
  <p style="font-size:12px;color:var(--muted);margin-top:8px">印刷画面で「PDFとして保存」も選べます。ホーム画面から開いたアプリで印刷画面が出ない時は、Safariでこのページを開き、共有ボタン →「プリント」を選んでください。</p>
  <div class="actions"><span></span><span style="display:flex;gap:8px"><button class="btn" data-close="1">やめる</button><button class="btn primary" data-doprint="1">印刷する</button></span></div>`);
}
window.addEventListener("beforeprint",buildPrint);
function tmplSheet(){
  openSheet(`<h2>よくある備蓄から一括追加</h2><p style="font-size:13px;color:var(--muted);margin-top:4px">家にあるものにチェックを入れてください。数と期限はあとで直せます。</p>
  <form id="f-tmpl" class="form"><div class="tmpl">${TEMPLATES.map((t,i)=>`<label><input type="checkbox" id="t${i}" value="${i}">${esc(t.name)}<span style="margin-left:auto;color:var(--muted);font-size:12px">${t.qty}${CATS[t.cat].calc?"個":CATS[t.cat].unit}</span></label>`).join("")}</div>
  <div class="actions"><span></span><span style="display:flex;gap:8px"><button type="button" class="btn" data-close="1">やめる</button><button class="btn primary" type="submit">追加する</button></span></div></form>`);
  document.getElementById("f-tmpl").addEventListener("submit",e=>{
    e.preventDefault();let c=0;
    document.querySelectorAll("#f-tmpl input:checked").forEach(x=>{const t=TEMPLATES[+x.value];S.items.push({id:S.seq++,name:t.name,cat:t.cat,per:t.per,qty:t.qty,exp:t.days?plus(t.days):"",place:"押入れ",ess:t.ess});c++});
    save();closeSheet();render();toast(c+"品目を追加しました");
  });
}
function familySheet(){
  openSheet(`<h2>家族の取り決め</h2><form id="f-fam" class="form">
  ${S.contacts.map((c,i)=>`<div class="two"><label>名前<input id="c-n${i}" value="${esc(c.name)}"></label><label>電話番号<input id="c-t${i}" inputmode="tel" value="${esc(c.tel)}"></label></div>`).join("")}
  <div class="two"><label>名前<input id="c-nx" placeholder="追加する人"></label><label>電話番号<input id="c-tx" inputmode="tel"></label></div>
  <label>集合場所<input id="m1" value="${esc(S.meet)}"></label><label>第2の集合場所<input id="m2" value="${esc(S.meet2)}"></label>
  <div class="actions"><span></span><span style="display:flex;gap:8px"><button type="button" class="btn" data-close="1">やめる</button><button class="btn primary" type="submit">保存</button></span></div></form>`);
  document.getElementById("f-fam").addEventListener("submit",e=>{
    e.preventDefault();
    S.contacts=S.contacts.map((c,i)=>({name:document.getElementById("c-n"+i).value,tel:document.getElementById("c-t"+i).value})).filter(c=>c.name||c.tel);
    const nx=document.getElementById("c-nx").value,tx=document.getElementById("c-tx").value;if(nx||tx)S.contacts.push({name:nx,tel:tx});
    S.meet=document.getElementById("m1").value;S.meet2=document.getElementById("m2").value;
    save();closeSheet();render();toast("保存しました");
  });
}
function backupSheet(){
  openSheet(`<h2>バックアップ</h2><p style="font-size:13px;color:var(--muted);margin-top:4px">この文字列を保存しておくと、機種変更の時に戻せます（公開版ではファイルで保存）。</p>
  <div class="form"><label>データ<textarea id="bk" readonly>${esc(JSON.stringify(S))}</textarea></label>
  <div class="actions"><span></span><span style="display:flex;gap:8px"><button class="btn" data-close="1">閉じる</button><button class="btn primary" data-copy="1">コピー</button></span></div></div>`);
}
function resetSheet(){
  openSheet(`<h2>サンプルに戻しますか？</h2><p style="margin-top:8px">登録した内容は消えて、最初のサンプルデータに戻ります。</p>
  <div class="actions"><span></span><span style="display:flex;gap:8px"><button class="btn" data-close="1">やめる</button><button class="btn primary" data-doreset="1">戻す</button></span></div>`);
}
let tt;function toast(m){clearTimeout(tt);let el=document.querySelector(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=m;tt=setTimeout(()=>el.remove(),2200)}

// ---- routing & events
function render(){
  const v={home:vHome,stock:vStock,shop:vShop,sos:vSos,more:vMore}[view]||vHome;
  document.getElementById("app").innerHTML=v();renderTabs();
}
function go(v){view=v;try{if(location.hash!=="#"+v)history.replaceState(null,"","#"+v)}catch(e){}render();window.scrollTo(0,0)}
document.addEventListener("click",e=>{
  const t=e.target.closest("button,.overlay");if(!t)return;
  const d=t.dataset;
  if(d.close){if(t.classList.contains("overlay")&&e.target!==t)return;closeSheet();return}
  if(d.tab)return go(d.tab);
  if(d.go)return go(d.go);
  if(d.mode){stockMode=d.mode;return render()}
  if(d.sos){sosKind=d.sos;return render()}
  if(d.use){const i=S.items.find(x=>x.id==d.use);if(i&&i.qty>0){i.qty--;i.used=(i.used||0)+1;save();render();toast(i.name+"を1つ使いました。買い物リストに追加")}return}
  if(d.bought){const i=S.items.find(x=>x.id==d.bought);if(i){i.qty+=i.used;i.used=0;save();render();toast("在庫に戻しました。期限は編集で直せます")}return}
  if(d.edit)return editSheet(S.items.find(x=>x.id==d.edit));
  if(d.add)return editSheet(null);
  if(d.tmpl)return tmplSheet();
  if(d.del){S.items=S.items.filter(x=>x.id!=d.del);save();closeSheet();render();return toast("削除しました")}
  if(d.hh){S.hh[d.hh]=Math.max(0,S.hh[d.hh]+(+d.d));if(persons()<1)S.hh.adult=1;save();return render()}
  if(d.goal){S.goal=+d.goal;save();return render()}
  if(d.family)return familySheet();
  if(d.backup)return backupSheet();
  if(d.reset)return resetSheet();
  if(d.doreset){S=sample();save();closeSheet();render();return toast("サンプルに戻しました")}
  if(d.scan)return openScanner(applyCode);
  if(d.scanadd)return editSheet(null,true);
  if(d.scanclose)return closeScanner();
  if(d.cal)return calSheet();
  if(d.calone){const i=S.items.find(x=>x.id==d.calone);if(i)downloadIcs([i],30);return}
  if(d.print)return printSheet();
  if(d.doprint){buildPrint();closeSheet();setTimeout(()=>{try{window.print()}catch(e){toast("この画面では印刷できません。Safariで開いてください")}},100);return}
  if(d.copy){const ta=document.getElementById("bk");const p=navigator.clipboard?navigator.clipboard.writeText(ta.value):Promise.reject();p.then(()=>toast("コピーしました")).catch(()=>{ta.select();toast("選択しました。長押しでコピーしてください")});return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeScanner();closeSheet()}});
function fromHash(){const h=(location.hash||"").slice(1);if(["home","stock","shop","sos","more"].includes(h))view=h;render()}
window.addEventListener("hashchange",fromHash);
fromHash();
})();
</script>
